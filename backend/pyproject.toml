[project]
name = "tanya-lalin"
version = "2.0.0"
description = "RAG-based chatbot for Indonesian traffic law Q&A"
authors = [{ name = "Malik Fajar Mubarok", email = "mubarok.malikfajar@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.0.0",
    "langchain-core>=1.2.0,<2.0.0",
    "langchain-openai>=1.4.0,<2.0.0",
    "openai>=2.45.0,<4.0.0",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
data = [
    "pyarrow>=18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
