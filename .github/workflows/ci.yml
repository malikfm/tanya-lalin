name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run ruff format --check app tests scripts eval
        working-directory: backend
      - run: uv run ruff check app tests scripts eval
        working-directory: backend
      - run: uv run pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
        working-directory: backend
      - run: uv run coverage report --include='app/rag/*' --fail-under=90
        working-directory: backend
      - run: uv run python -m scripts.verify_corpus
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tanya-lalin:test
